name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS and site
        run: npm run build

      - name: Write version marker
        run: echo '{"sha":"${{ github.sha }}","run":${{ github.run_id }}}' > _site/version.json

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEBSITE_SCANDELARI }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        shell: bash
        run: |
          firebase deploy --only hosting --project website-scandelari > /tmp/firebase.log 2>&1 || EXIT=$?
          EXIT=${EXIT:-0}
          cat /tmp/firebase.log
          if [ "$EXIT" -ne 0 ] && grep -q "current active version" /tmp/firebase.log; then
            echo "Version already live — deploy succeeded."
            exit 0
          fi
          exit "$EXIT"
