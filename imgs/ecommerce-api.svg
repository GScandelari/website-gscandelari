<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="190" fill="url(#badgeGrad)"/>

  <!-- carrinho de compras, desenho geometrico simples, centralizado em x=200 -->
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120,140 L280,140 L260,260 L140,260 Z"/>
    <path d="M120,140 L80,90 L50,90"/>
    <circle cx="160" cy="300" r="16" fill="#ffffff" stroke="none"/>
    <circle cx="240" cy="300" r="16" fill="#ffffff" stroke="none"/>
  </g>

  <!-- "{ }" sobreposto, referencia a API -->
  <text x="200" y="235" font-family="Arial, sans-serif" font-weight="700" font-size="150"
        text-anchor="middle" fill="#ffffff" fill-opacity="0.14">{ }</text>
</svg>
